<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>もちひめ - 舞姫テスト対策</title>
    <style>
        :root {
            --primary-color: #5d4037;
            --bg-color: #f4f1ea;
            --btn-hover: #795548;
        }
        body {
            font-family: "Hiragino Mincho ProN", "MS PMincho", serif;
            background-color: var(--bg-color);
            color: #333;
            display: flex;
            justify-content: center;
            padding: 20px;
            margin: 0;
            line-height: 1.6;
        }
        #app {
            width: 100%;
            max-width: 650px;
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .screen { text-align: center; }
        .hidden { display: none !important; }
        h1 {
            color: var(--primary-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
            margin-top: 0;
        }
        .input-group { margin: 20px 0; text-align: left; }
        label { font-weight: bold; }
        input[type="password"], textarea {
            width: 100%; padding: 12px; margin-top: 8px;
            border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
            font-family: inherit; font-size: 1rem;
        }
        button {
            background-color: var(--primary-color); color: white;
            border: none; padding: 14px 24px; margin: 10px 0;
            border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%;
            transition: background-color 0.2s;
            font-family: inherit;
        }
        button:hover:not(:disabled) { background-color: var(--btn-hover); }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .choice-btn {
            background-color: #fff; color: #333;
            border: 2px solid var(--primary-color);
            text-align: left; transition: 0.2s; margin-bottom: 10px;
        }
        .choice-btn:hover:not(:disabled) { background-color: #efebe9; }
        
        #progress { font-size: 0.9rem; color: #666; text-align: right; margin-bottom: 10px; }
        #question-text {
            font-size: 1.25rem; font-weight: bold; margin: 20px 0; text-align: left;
            border-left: 5px solid var(--primary-color); padding-left: 15px;
        }
        #feedback {
            margin-top: 20px; padding: 15px; border-radius: 4px;
            background: #f9f9f9; text-align: left; border: 1px solid #ddd;
        }
        #result-label { font-weight: bold; font-size: 1.3rem; margin-bottom: 10px; }
        .score-display { font-size: 1.5rem; font-weight: bold; color: var(--primary-color); margin: 20px 0; }
    </style>
</head>
<body>
    <div id="app">
        <div id="setup-screen" class="screen">
            <h1>もちひめ</h1>
            <p>森鴎外「舞姫」定期考査対策アプリ</p>
            <div class="input-group">
                <label for="api-key">Gemini API Key:</label>
                <input type="password" id="api-key" placeholder="空欄ならオフラインモード（3択のみ）">
            </div>
            <button onclick="app.startMenu()">開始する</button>
        </div>

        <div id="menu-screen" class="screen hidden">
            <h1>メニュー</h1>
            <p id="mode-status"></p>
            <button onclick="app.startMode('choice')">3択クイズモード</button>
            <button id="desc-btn" onclick="app.startMode('desc')">記述演習モード (オンライン)</button>
            <button onclick="location.reload()" style="background-color: #777;">戻る</button>
        </div>

        <div id="quiz-screen" class="screen hidden">
            <div id="progress"></div>
            <div id="question-text"></div>
            
            <div id="choice-container" class="hidden">
                <button class="choice-btn" onclick="app.selectChoice(0)"></button>
                <button class="choice-btn" onclick="app.selectChoice(1)"></button>
                <button class="choice-btn" onclick="app.selectChoice(2)"></button>
            </div>

            <div id="desc-container" class="hidden">
                <textarea id="user-answer" placeholder="ここに解答を入力..." rows="4"></textarea>
                <button id="submit-desc-btn" onclick="app.submitDesc()">採点する</button>
            </div>

            <div id="feedback" class="hidden">
                <div id="result-label"></div>
                <div id="explanation" style="white-space: pre-wrap;"></div>
                <button id="next-btn" onclick="app.nextQuestion()">次へ</button>
            </div>
        </div>

        <div id="result-screen" class="screen hidden">
            <h1>学習終了</h1>
            <div id="final-score" class="score-display"></div>
            <button onclick="app.returnToMenu()">メニューに戻る</button>
        </div>
    </div>

    <script type="importmap">
      {
        "imports": {
          "@google/generative-ai": "https://esm.run/@google/generative-ai"
        }
      }
    </script>

                ans: "自分のために尽力し、一度閉ざされた出世の道へ戻してくれた点。",
                memo: "豊太郎が大臣の信頼を得られるよう尽力し、出世の道に戻してくれた点。",
                distractors: ["自分の借金をすべて立て替え経済的な不安を取り除いてくれた点。","エリスを最後まで熱心に説得し円満な別れを演出してくれた点。","毎日美味しい料理を作って病床の自分を献身的に看病してくれた点。","自分の代わりに素晴らしい論文を執筆し学位を取得させてくれた点。","日本から遠路はるばる毎日見舞いに来て心の支えになってくれた点。"]
            },
            {
                loc: "P249 L9",
                q: "相沢を憎んでいるのはなぜか？",
                ans: "相沢が良友として尽力した結果、エリスを廃人に追い込む決定打を作った張本人だから。",
                memo: "相沢のおかげで出世の道に戻れたものの、それが結果的にエリスを廃人にする決定的な原因となったため。良友であり恩人だが、憎しみの対象でもあるという逆説。",
                distractors: ["豊太郎の金を密かに横領し私腹を肥やしていたことが発覚した張本人だから。","エリスに横恋慕し豊太郎がいない間に強引に関係を持とうとした張本人だから。","大臣に嘘の報告をして豊太郎の評判を意図的に貶めようとした張本人だから。","帰国の船のチケットを勝手にキャンセルし豊太郎を孤立させた張本人だから。","豊太郎をドイツに置き去りにして自分だけ先に出世してしまった張本人だから。"]
            }
        ];

        window.app = {
            apiKey: "",
            genAI: null,
            currentIndex: 0,
            score: 0,
            mode: "",
            correctIndex: 0,

            startMenu() {
                this.apiKey = document.getElementById('api-key').value.trim();
                const status = document.getElementById('mode-status');
                const descBtn = document.getElementById('desc-btn');

                if (this.apiKey) {
                    this.genAI = new GoogleGenerativeAI(this.apiKey);
                    status.innerText = "オンラインモード";
                    descBtn.disabled = false;
                } else {
                    this.genAI = null;
                    status.innerText = "オフラインモード（記述不可）";
                    descBtn.disabled = true;
                }
                this.showScreen('menu-screen');
            },

            showScreen(id) {
                document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
                document.getElementById(id).classList.remove('hidden');
            },

            async startMode(m) {
                this.mode = m;
                this.currentIndex = 0;
                this.score = 0;
                this.showScreen('quiz-screen');
                await this.loadQuestion();
            },

            async loadQuestion() {
                const data = quizData[this.currentIndex];
                document.getElementById('progress').innerText = `${this.currentIndex + 1} / ${quizData.length}`;
                document.getElementById('question-text').innerText = data.q;
                document.getElementById('feedback').classList.add('hidden');
                document.getElementById('user-answer').value = "";
                document.getElementById('submit-desc-btn').disabled = false;

                if (this.mode === 'choice') {
                    document.getElementById('choice-container').classList.remove('hidden');
                    document.getElementById('desc-container').classList.add('hidden');
                    await this.prepareChoices(data);
                } else {
                    document.getElementById('choice-container').classList.add('hidden');
                    document.getElementById('desc-container').classList.remove('hidden');
                }
            },

            async prepareChoices(data) {
                const btns = document.querySelectorAll('.choice-btn');
                btns.forEach(b => { b.innerText = "生成中..."; b.disabled = true; b.style.backgroundColor = ""; });

                let finalChoices = [];
                if (this.genAI) {
                    try {
                        const modelLite = this.genAI.getGenerativeModel({ model: "gemini-2.5-flash-lite" });
                        const modelPro = this.genAI.getGenerativeModel({ model: "gemini-2.5-flash" });

const [distRes, paraRes] = await Promise.all([
    modelLite.generateContent(`問題: ${data.q}\n正解: ${data.ans}\nこの正解に近い文字数と複雑さで誤りである選択肢を2つ作ってください。文末を「〜ため。」などの正解の形式に合わせてください。出力形式: 誤答1|誤答2`),
    modelPro.generateContent(`「${data.ans}」という文章を、意味や複雑さを変えずに1つ言い換えてください。文末は変えないでください。`)
]);
const dists = distRes.response.text().split('|').map(text => text.replace(/^誤答\d*[:：\s]*/, '').trim());
const paraphrased = paraRes.response.text().trim();

// 分割できた要素が足りない場合のエラーハンドリングを追加して安全にする
if (dists.length >= 2) {
    finalChoices = [paraphrased, dists[0], dists[1]];
} else {
    throw new Error("フォーマットエラー");
}
                    } catch(e) {
                        finalChoices = [data.ans, data.distractors[0], data.distractors[1]];
                    }
                } else {
                    finalChoices = [data.ans, data.distractors[0], data.distractors[1]];
                }

                const mapped = finalChoices.map((t, i) => ({ t, correct: i === 0 })).sort(() => Math.random() - 0.5);
                this.correctIndex = mapped.findIndex(m => m.correct);
                btns.forEach((b, i) => {
                    b.innerText = mapped[i].t;
                    b.disabled = false;
                });
            },

            selectChoice(idx) {
                const btns = document.querySelectorAll('.choice-btn');
                btns.forEach(b => b.disabled = true);
                const win = idx === this.correctIndex;
                if(win) { this.score++; btns[idx].style.backgroundColor = "#c8e6c9"; }
                else { btns[idx].style.backgroundColor = "#ffcdd2"; btns[this.correctIndex].style.backgroundColor = "#c8e6c9"; }
                this.showFeedback(win, `【解説】\n${quizData[this.currentIndex].memo}`);
            },

            async submitDesc() {
                const userAns = document.getElementById('user-answer').value.trim();
                if(!userAns || !this.genAI) return;

                document.getElementById('submit-desc-btn').disabled = true;
                document.getElementById('result-label').innerText = "採点中...";
                document.getElementById('feedback').classList.remove('hidden');

                try {
                    const model = this.genAI.getGenerativeModel({ model: "gemini-2.5-flash" });
                    const prompt = `森鴎外『舞姫』の記述問題の採点を行ってください。
                    問題: ${quizData[this.currentIndex].q}
                    模範解答: ${quizData[this.currentIndex].ans}
                    授業メモ（採点ポイント）: ${quizData[this.currentIndex].memo}
                    生徒の解答: ${userAns}

                    採点基準:
                    1. 授業メモにある主要なキーワードや論理的背景が含まれていれば、概ね80点としてください。
                    2. 表現がより正確で、文脈に即している場合はさらに加点してください。
                    3. 文末表現の不備は軽微な減点に留めてください。

                    必ず以下のJSON形式のみで出力してください。余計な挨拶や解説は不要です。:
                    {"score": 0-100, "judgment": "正解/部分点/不正解", "comment": "簡潔な評価"} `;

                    const result = await model.generateContent(prompt);
                    const raw = result.response.text();
                    const jsonMatch = raw.match(/\{.*\}/s);
                    const res = JSON.parse(jsonMatch[0]);

                    if(res.score >= 80) this.score++;
                    this.showFeedback(`${res.judgment} (${res.score}点)`, `${res.comment}\n\n【模範解答】\n${quizData[this.currentIndex].ans}`);
                } catch(e) {
                    this.showFeedback("エラー", "採点に失敗しました。");
                    document.getElementById('submit-desc-btn').disabled = false;
                }
            },

            showFeedback(title, detail) {
                document.getElementById('feedback').classList.remove('hidden');
                document.getElementById('result-label').innerText = title === true ? "⭕ 正解" : (title === false ? "❌ 不正解" : title);
                document.getElementById('explanation').innerText = detail;
            },

            nextQuestion() {
                this.currentIndex++;
                if(this.currentIndex < quizData.length) this.loadQuestion();
                else {
                    this.showScreen('result-screen');
                    document.getElementById('final-score').innerText = `${quizData.length}問中 ${this.score}問 正解`;
                }
            },

            returnToMenu() { this.showScreen('menu-screen'); }
        };
    </script>
</body>
</html>
